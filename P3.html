<!DOCTYPE html> 
<html lang="en"> 
<head> 
<title>Reservation Form</title> 
<meta charset="UTF-8"> 
</head> 
<body> 
<h2>Reservation Form</h2> 
<form action="#"> 
First Name: 
<input type="text"> 
<br><br> 
Last Name: 
<input type="text"> 
<br><br> 
<b>Address</b> 
<br><br> 
Number & Street: 
<input type="text"> 
<br><br> 
City: 
<input type="text"> 
<br><br> 
State: 
<input type="text"> 
<br><br> 
Zip Code: 
<input type="text"> 
<br><br> 
Check-in Date: 
<input type="date"> 
<br><br> 
Check-out Date: 
<input type="date"> 
<br><br> 
Phone: 
<input type="tel" placeholder="Enter your phone number"> <br><br> 
E-Mail Address: 
<input type="email" placeholder="name@domain.com"> <br><br> 
Payment Method: 
<select> 
<option>Credit Card</option> 
<option>Debit Card</option> 
<option>UPI</option> 
</select> 
<br><br>
Card Number: 
<input type="text"> 
<br><br> 
Special Requests: 
<br> 
<textarea placeholder="Enter your request here"></textarea> <br><br> 
<input type="submit" value="Submit"> 
<input type="reset" value="Clear"> 
</form> 
</body> 
</html>
